<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un hermoso día</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #c2185b, #ad1457);
            font-family: Arial, sans-serif;
        }

        h1 {
            position: absolute;
            top: 45%;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 42px;
            text-shadow:
                0 0 5px white,
                0 0 10px white,
                0 0 20px #ff80ab,
                0 0 30px #ff4081,
                0 0 40px #ff4081;
            z-index: 10;
        }

        .elemento {
            position: absolute;
            animation: aparecer var(--duracion) ease-in-out forwards;
            z-index: 2;
            user-select: none;
        }

        @keyframes aparecer {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            80% {
                opacity: 0.9;
            }

            100% {
                transform: scale(1);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <h1>Hola Yatsuri como estas te saluda tu buen amigo bell
    no quieres contarme otro chisme por ay</h1>

    <script>

        function crearElemento() {

            const elemento = document.createElement("div");

            elemento.classList.add("elemento");

            const emojis = [
                "❤️",
                "🩷",
                "🤍",
                "✨",
                "⭐",
                "🌸",
                "🦋",
                "💕",
                "🌷"
            ];

            elemento.innerHTML =
                emojis[Math.floor(Math.random() * emojis.length)];

            elemento.style.left =
                Math.random() * 95 + "vw";

            elemento.style.top =
                Math.random() * 90 + "vh";

            const tamaño =
                15 + Math.random() * 45;

            elemento.style.fontSize =
                tamaño + "px";

            const duracion =
                1.5 + Math.random() * 3;

            elemento.style.setProperty(
                "--duracion",
                duracion + "s"
            );

            document.body.appendChild(elemento);

            setTimeout(() => {
                elemento.remove();
            }, (duracion + 0.5) * 1000);
        }

        setInterval(crearElemento, 100);

    </script>

</body>
</html>
